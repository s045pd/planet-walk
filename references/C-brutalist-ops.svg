<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="'Helvetica Neue', 'Inter', sans-serif">
  <defs>
    <radialGradient id="planet-c" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#D8D8D8"/>
      <stop offset="45%" stop-color="#7A7A7A"/>
      <stop offset="80%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <pattern id="dots-c" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FFF"/>
      <circle cx="2" cy="2" r="0.4" fill="#000" opacity="0.18"/>
    </pattern>
    <pattern id="hatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background: off-white with fine dot grid -->
  <rect width="1440" height="900" fill="url(#dots-c)"/>

  <!-- TOP-LEFT: identification block (big typographic stack) -->
  <g>
    <rect x="0" y="0" width="480" height="200" fill="#000"/>
    <text x="32" y="60" fill="#FFF" font-size="14" letter-spacing="8" font-weight="700">PLANET / WALK</text>
    <text x="32" y="78" fill="#FFF" font-size="10" letter-spacing="6" opacity="0.5" font-family="'JetBrains Mono', monospace">MISSION CONTROL · OPS CONSOLE</text>

    <text x="32" y="160" fill="#FFF" font-size="120" font-weight="900" letter-spacing="-6" font-family="'Helvetica Neue', sans-serif">MARS</text>

    <!-- yellow tag -->
    <rect x="360" y="120" width="100" height="44" fill="#FFDE00"/>
    <text x="410" y="142" fill="#000" font-size="11" letter-spacing="3" text-anchor="middle" font-weight="700">TARGET</text>
    <text x="410" y="156" fill="#000" font-size="11" letter-spacing="3" text-anchor="middle" font-weight="700">ACQUIRED</text>
  </g>

  <!-- TOP-RIGHT: planet select as brutalist list -->
  <g transform="translate(480,0)">
    <rect width="960" height="200" fill="#FFF"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="200" x2="960" y2="200" stroke="#000" stroke-width="2"/>

    <text x="24" y="32" font-size="9" letter-spacing="4" font-family="'JetBrains Mono', monospace" font-weight="700">01 / SELECT BODY</text>
    <line x1="24" y1="42" x2="936" y2="42" stroke="#000" stroke-width="1"/>

    <!-- grid 5 -->
    <g transform="translate(24,62)" font-family="'JetBrains Mono', monospace">
      <!-- TERRA -->
      <g>
        <rect x="0" y="0" width="170" height="120" fill="#FFF" stroke="#000" stroke-width="1.5"/>
        <text x="12" y="20" font-size="9" letter-spacing="2">001 · TERRA</text>
        <text x="12" y="70" font-size="40" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">9.81</text>
        <text x="12" y="86" font-size="9" opacity="0.6">m · s⁻²</text>
        <text x="12" y="108" font-size="8" opacity="0.6">R = 6,371 km</text>
      </g>
      <!-- MARS selected -->
      <g transform="translate(186,0)">
        <rect x="0" y="0" width="170" height="120" fill="#000"/>
        <text x="12" y="20" font-size="9" letter-spacing="2" fill="#FFDE00">002 · MARS ●</text>
        <text x="12" y="70" font-size="40" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2" fill="#FFF">3.72</text>
        <text x="12" y="86" font-size="9" fill="#FFF" opacity="0.6">m · s⁻²</text>
        <text x="12" y="108" font-size="8" fill="#FFDE00">ACTIVE</text>
      </g>
      <!-- LUNA -->
      <g transform="translate(372,0)">
        <rect x="0" y="0" width="170" height="120" fill="#FFF" stroke="#000" stroke-width="1.5"/>
        <text x="12" y="20" font-size="9" letter-spacing="2">003 · LUNA</text>
        <text x="12" y="70" font-size="40" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">1.62</text>
        <text x="12" y="86" font-size="9" opacity="0.6">m · s⁻²</text>
        <text x="12" y="108" font-size="8" opacity="0.6">R = 1,737 km</text>
      </g>
      <!-- VENUS -->
      <g transform="translate(558,0)">
        <rect x="0" y="0" width="170" height="120" fill="#FFF" stroke="#000" stroke-width="1.5"/>
        <text x="12" y="20" font-size="9" letter-spacing="2">004 · VENUS</text>
        <text x="12" y="70" font-size="40" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">8.87</text>
        <text x="12" y="86" font-size="9" opacity="0.6">m · s⁻²</text>
        <text x="12" y="108" font-size="8" fill="#FF2D00">⚠ 92 atm · 464°C</text>
      </g>
      <!-- EUROPA -->
      <g transform="translate(744,0)">
        <rect x="0" y="0" width="170" height="120" fill="#FFF" stroke="#000" stroke-width="1.5"/>
        <text x="12" y="20" font-size="9" letter-spacing="2">005 · EUROPA</text>
        <text x="12" y="70" font-size="40" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">1.31</text>
        <text x="12" y="86" font-size="9" opacity="0.6">m · s⁻²</text>
        <text x="12" y="108" font-size="8" opacity="0.6">R = 1,560 km</text>
      </g>
    </g>
  </g>

  <!-- LEFT MIDDLE: telemetry stack -->
  <g transform="translate(0,200)">
    <rect width="360" height="480" fill="#FFF"/>
    <line x1="360" y1="0" x2="360" y2="480" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="480" x2="360" y2="480" stroke="#000" stroke-width="2"/>

    <g transform="translate(32,40)" font-family="'JetBrains Mono', monospace">
      <text x="0" y="0" font-size="9" letter-spacing="4" font-weight="700">02 / SURFACE POSITION</text>
      <line x1="0" y1="10" x2="296" y2="10" stroke="#000" stroke-width="1"/>

      <text x="0" y="42" font-size="10" opacity="0.5" letter-spacing="3">LATITUDE</text>
      <text x="0" y="82" font-size="44" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">−14.502°</text>
      <line x1="0" y1="100" x2="296" y2="100" stroke="#000" stroke-width="0.5" opacity="0.3"/>

      <text x="0" y="128" font-size="10" opacity="0.5" letter-spacing="3">LONGITUDE</text>
      <text x="0" y="168" font-size="44" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">+175.830°</text>
      <line x1="0" y1="186" x2="296" y2="186" stroke="#000" stroke-width="0.5" opacity="0.3"/>

      <text x="0" y="214" font-size="10" opacity="0.5" letter-spacing="3">ELEVATION</text>
      <text x="0" y="254" font-size="44" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">+2,847<tspan font-size="14" opacity="0.5"> M</tspan></text>
      <line x1="0" y1="272" x2="296" y2="272" stroke="#000" stroke-width="0.5" opacity="0.3"/>

      <text x="0" y="300" font-size="10" opacity="0.5" letter-spacing="3">VELOCITY</text>
      <text x="0" y="340" font-size="44" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-2">4.2<tspan font-size="14" opacity="0.5"> M/S</tspan></text>

      <!-- mode block -->
      <rect x="0" y="370" width="296" height="44" fill="#000"/>
      <text x="16" y="400" fill="#FFDE00" font-size="18" letter-spacing="4" font-weight="700">MODE · SURFACE</text>
    </g>
  </g>

  <!-- CENTER: big planet render -->
  <g transform="translate(360,200)">
    <rect width="720" height="480" fill="#000"/>
    <!-- fine grid lines on black -->
    <g stroke="#FFF" stroke-width="0.3" opacity="0.15">
      <line x1="0" y1="96" x2="720" y2="96"/>
      <line x1="0" y1="192" x2="720" y2="192"/>
      <line x1="0" y1="288" x2="720" y2="288"/>
      <line x1="0" y1="384" x2="720" y2="384"/>
      <line x1="144" y1="0" x2="144" y2="480"/>
      <line x1="288" y1="0" x2="288" y2="480"/>
      <line x1="432" y1="0" x2="432" y2="480"/>
      <line x1="576" y1="0" x2="576" y2="480"/>
    </g>

    <g transform="translate(360,240)">
      <circle r="210" fill="url(#planet-c)"/>
      <!-- mars-like surface -->
      <ellipse cx="-70" cy="-50" rx="60" ry="14" fill="#1A1A1A" opacity="0.6"/>
      <ellipse cx="40" cy="70" rx="95" ry="22" fill="#1A1A1A" opacity="0.55"/>
      <ellipse cx="-110" cy="80" rx="30" ry="10" fill="#555" opacity="0.5"/>
      <circle cx="70" cy="-100" r="25" fill="#0A0A0A" opacity="0.6"/>
      <!-- perfect monochrome treatment using overlay -->
      <circle r="210" fill="#FFDE00" opacity="0.06"/>

      <!-- bracket corners (brutalist targeting) -->
      <g stroke="#FFDE00" stroke-width="2.5" fill="none">
        <path d="M -260 -260 L -260 -220 L -220 -260"/>
        <path d="M 260 -260 L 260 -220 L 220 -260"/>
        <path d="M -260 260 L -260 220 L -220 260"/>
        <path d="M 260 260 L 260 220 L 220 260"/>
      </g>

      <!-- position indicator pin -->
      <circle cx="30" cy="80" r="10" fill="#FF2D00"/>
      <circle cx="30" cy="80" r="5" fill="#FFF"/>
      <line x1="30" y1="80" x2="200" y2="200" stroke="#FF2D00" stroke-width="1.5"/>
    </g>

    <!-- caption on black -->
    <text x="24" y="32" fill="#FFF" font-size="9" letter-spacing="4" font-family="'JetBrains Mono', monospace" font-weight="700">03 / VISUALIZATION</text>
    <line x1="24" y1="42" x2="696" y2="42" stroke="#FFF" stroke-width="0.5" opacity="0.3"/>

    <text x="696" y="460" fill="#FFF" font-size="9" letter-spacing="4" font-family="'JetBrains Mono', monospace" text-anchor="end" opacity="0.7">SCALE 1 : 4.73 × 10⁷ · PROJ. ORTHOGRAPHIC</text>

    <!-- red indicator top-right corner inside -->
    <g transform="translate(640,60)">
      <rect width="56" height="22" fill="#FF2D00"/>
      <text x="28" y="16" fill="#FFF" font-size="10" letter-spacing="3" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', monospace">LIVE</text>
    </g>

    <!-- scale ruler -->
    <g transform="translate(24,440)" font-family="'JetBrains Mono', monospace" fill="#FFF">
      <line x1="0" y1="0" x2="180" y2="0" stroke="#FFF" stroke-width="1"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#FFF"/>
      <line x1="90" y1="-3" x2="90" y2="3" stroke="#FFF"/>
      <line x1="180" y1="-4" x2="180" y2="4" stroke="#FFF"/>
      <text x="0" y="-8" font-size="9">0</text>
      <text x="180" y="-8" font-size="9" text-anchor="end">3,389 km</text>
    </g>
  </g>

  <!-- RIGHT: diagnostics -->
  <g transform="translate(1080,200)">
    <rect width="360" height="480" fill="#FFF"/>
    <line x1="0" y1="0" x2="0" y2="480" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="480" x2="360" y2="480" stroke="#000" stroke-width="2"/>

    <g transform="translate(32,40)" font-family="'JetBrains Mono', monospace">
      <text x="0" y="0" font-size="9" letter-spacing="4" font-weight="700">04 / SYSTEM</text>
      <line x1="0" y1="10" x2="296" y2="10" stroke="#000" stroke-width="1"/>

      <g font-size="11">
        <text x="0" y="38" opacity="0.5" letter-spacing="2">FPS</text>
        <text x="296" y="38" text-anchor="end" font-size="24" font-weight="900" font-family="'Helvetica Neue', sans-serif">60.0</text>

        <line x1="0" y1="54" x2="296" y2="54" stroke="#000" stroke-width="0.4" opacity="0.25"/>

        <text x="0" y="82" opacity="0.5" letter-spacing="2">NODES</text>
        <text x="296" y="82" text-anchor="end" font-size="24" font-weight="900" font-family="'Helvetica Neue', sans-serif">1,284</text>
        <line x1="0" y1="98" x2="296" y2="98" stroke="#000" stroke-width="0.4" opacity="0.25"/>

        <text x="0" y="126" opacity="0.5" letter-spacing="2">MEMORY</text>
        <text x="296" y="126" text-anchor="end" font-size="24" font-weight="900" font-family="'Helvetica Neue', sans-serif">142<tspan font-size="12" opacity="0.5"> MB</tspan></text>
        <line x1="0" y1="142" x2="296" y2="142" stroke="#000" stroke-width="0.4" opacity="0.25"/>

        <text x="0" y="170" opacity="0.5" letter-spacing="2">DRAW CALLS</text>
        <text x="296" y="170" text-anchor="end" font-size="24" font-weight="900" font-family="'Helvetica Neue', sans-serif">87</text>
        <line x1="0" y1="186" x2="296" y2="186" stroke="#000" stroke-width="0.4" opacity="0.25"/>

        <text x="0" y="214" opacity="0.5" letter-spacing="2">HEADING</text>
        <text x="296" y="214" text-anchor="end" font-size="24" font-weight="900" font-family="'Helvetica Neue', sans-serif">042.7°</text>
      </g>

      <!-- compass square -->
      <g transform="translate(148,310)">
        <rect x="-80" y="-80" width="160" height="160" fill="#000"/>
        <text x="0" y="-64" fill="#FFDE00" font-size="12" text-anchor="middle" font-weight="700">N</text>
        <text x="68" y="4" fill="#FFF" font-size="10" text-anchor="middle" opacity="0.5">E</text>
        <text x="0" y="74" fill="#FFF" font-size="10" text-anchor="middle" opacity="0.5">S</text>
        <text x="-68" y="4" fill="#FFF" font-size="10" text-anchor="middle" opacity="0.5">W</text>
        <line x1="0" y1="0" x2="40" y2="-40" stroke="#FFDE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="3" fill="#FFDE00"/>
      </g>
    </g>
  </g>

  <!-- BOTTOM BAR: controls -->
  <g transform="translate(0,680)">
    <rect width="1440" height="140" fill="#FFDE00"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#000" stroke-width="2"/>

    <g font-family="'JetBrains Mono', monospace" fill="#000">
      <text x="32" y="34" font-size="9" letter-spacing="4" font-weight="700">05 / INPUT MAP</text>
      <line x1="32" y1="44" x2="1408" y2="44" stroke="#000" stroke-width="1"/>

      <!-- key cells -->
      <g transform="translate(32,60)">
        <g>
          <rect width="72" height="56" fill="#000"/>
          <text x="36" y="24" fill="#FFF" font-size="14" text-anchor="middle" font-weight="900">W A S D</text>
          <text x="36" y="46" fill="#FFDE00" font-size="8" text-anchor="middle" letter-spacing="2">STRIDE</text>
        </g>
        <g transform="translate(88,0)">
          <rect width="72" height="56" fill="#000"/>
          <text x="36" y="28" fill="#FFF" font-size="16" text-anchor="middle" font-weight="900">␣</text>
          <text x="36" y="46" fill="#FFDE00" font-size="8" text-anchor="middle" letter-spacing="2">JUMP</text>
        </g>
        <g transform="translate(176,0)">
          <rect width="72" height="56" fill="#000"/>
          <text x="36" y="28" fill="#FFF" font-size="12" text-anchor="middle" font-weight="900">MOUSE</text>
          <text x="36" y="46" fill="#FFDE00" font-size="8" text-anchor="middle" letter-spacing="2">GAZE</text>
        </g>
        <g transform="translate(264,0)">
          <rect width="72" height="56" fill="#000"/>
          <text x="36" y="28" fill="#FFF" font-size="14" text-anchor="middle" font-weight="900">TAB</text>
          <text x="36" y="46" fill="#FFDE00" font-size="8" text-anchor="middle" letter-spacing="2">MODE</text>
        </g>
        <g transform="translate(352,0)">
          <rect width="72" height="56" fill="#000"/>
          <text x="36" y="28" fill="#FFF" font-size="16" text-anchor="middle" font-weight="900">M</text>
          <text x="36" y="46" fill="#FFDE00" font-size="8" text-anchor="middle" letter-spacing="2">CHART</text>
        </g>
        <g transform="translate(440,0)">
          <rect width="72" height="56" fill="#000"/>
          <text x="36" y="28" fill="#FFF" font-size="16" text-anchor="middle" font-weight="900">F</text>
          <text x="36" y="46" fill="#FFDE00" font-size="8" text-anchor="middle" letter-spacing="2">NOTE</text>
        </g>
      </g>

      <!-- stream log -->
      <g transform="translate(580,60)" font-size="11">
        <text x="0" y="14" font-weight="700" letter-spacing="3" font-size="9">STREAM LOG</text>
        <text x="0" y="34" opacity="0.8">14:32:07 ▸ LANDED · sector −14.5S +175.8E</text>
        <text x="0" y="48" opacity="0.6">14:31:42 · atmospheric entry complete</text>
      </g>

      <!-- timestamp right -->
      <g transform="translate(1408,60)" text-anchor="end">
        <text x="0" y="14" font-size="9" letter-spacing="4" font-weight="700">TIME</text>
        <text x="0" y="46" font-size="28" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-1">2026-04-17</text>
        <text x="0" y="68" font-size="16" font-weight="700">14:32:07 UTC</text>
      </g>

      <text x="32" y="132" font-size="9" letter-spacing="3" opacity="0.6">FILE // planet-walk.ops.console · rev 0.2 · s045pd@local</text>
      <text x="1408" y="132" font-size="9" letter-spacing="3" opacity="0.6" text-anchor="end">□ IN SERVICE</text>
    </g>
  </g>

  <!-- very bottom strip -->
  <g transform="translate(0,820)">
    <rect width="1440" height="80" fill="#000"/>
    <text x="32" y="34" fill="#FFF" font-size="9" letter-spacing="4" font-family="'JetBrains Mono', monospace" font-weight="700">PLANET / WALK · OPS CONSOLE · v0.2</text>
    <text x="32" y="56" fill="#FFF" font-size="22" font-weight="900" font-family="'Helvetica Neue', sans-serif" letter-spacing="-1">On foot. On another world.</text>

    <text x="1408" y="34" fill="#FFF" font-size="9" letter-spacing="4" font-family="'JetBrains Mono', monospace" text-anchor="end" opacity="0.7">CHANNEL // DEEP-SPACE · 8.4 GHz</text>
    <text x="1408" y="56" fill="#FFDE00" font-size="22" font-weight="900" font-family="'Helvetica Neue', sans-serif" text-anchor="end" letter-spacing="-1">SOL 047 · 12:41</text>
  </g>
</svg>
