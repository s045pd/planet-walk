<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="'D-DIN', 'GT America Mono', 'Space Mono', 'Inter', sans-serif">
  <defs>
    <!-- true space black, slight gradient to avoid flat -->
    <radialGradient id="bg-d" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="70%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- Mars body -->
    <radialGradient id="planet-d" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#D9966A"/>
      <stop offset="40%" stop-color="#9E5130"/>
      <stop offset="80%" stop-color="#3A1A0E"/>
      <stop offset="100%" stop-color="#0A0504"/>
    </radialGradient>

    <!-- thin atmosphere rim -->
    <radialGradient id="atmo-d" cx="50%" cy="50%">
      <stop offset="85%" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="96%" stop-color="#FFAD72" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFAD72" stop-opacity="0"/>
    </radialGradient>

    <!-- sparse starfield -->
    <pattern id="stars" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#000" opacity="0"/>
      <circle cx="23" cy="41" r="0.6" fill="#FFF" opacity="0.7"/>
      <circle cx="87" cy="19" r="0.4" fill="#FFF" opacity="0.4"/>
      <circle cx="152" cy="62" r="0.5" fill="#FFF" opacity="0.6"/>
      <circle cx="178" cy="133" r="0.7" fill="#FFF" opacity="0.8"/>
      <circle cx="44" cy="158" r="0.3" fill="#FFF" opacity="0.3"/>
      <circle cx="110" cy="179" r="0.5" fill="#FFF" opacity="0.55"/>
      <circle cx="67" cy="88" r="0.3" fill="#FFF" opacity="0.35"/>
      <circle cx="135" cy="105" r="0.4" fill="#FFF" opacity="0.45"/>
    </pattern>

    <!-- bracket corners reused -->
    <g id="bracket-tl"><path d="M 0 0 L 0 14 M 0 0 L 14 0" stroke="#FFF" stroke-width="1.2" fill="none"/></g>
    <g id="bracket-tr"><path d="M 0 0 L 0 14 M 0 0 L -14 0" stroke="#FFF" stroke-width="1.2" fill="none"/></g>
    <g id="bracket-bl"><path d="M 0 0 L 0 -14 M 0 0 L 14 0" stroke="#FFF" stroke-width="1.2" fill="none"/></g>
    <g id="bracket-br"><path d="M 0 0 L 0 -14 M 0 0 L -14 0" stroke="#FFF" stroke-width="1.2" fill="none"/></g>
  </defs>

  <!-- base -->
  <rect width="1440" height="900" fill="url(#bg-d)"/>
  <rect width="1440" height="900" fill="url(#stars)"/>

  <!-- ============ TOP BAR ============ -->
  <g>
    <!-- left: SPACEX-style logo mark -->
    <text x="40" y="46" fill="#FFF" font-size="26" font-weight="300" letter-spacing="10" font-family="'Inter', sans-serif">PLANET · WALK</text>
    <line x1="40" y1="58" x2="290" y2="58" stroke="#FFF" stroke-width="0.5" opacity="0.4"/>
    <text x="40" y="74" fill="#FFF" font-size="10" letter-spacing="5" opacity="0.5" font-family="'Space Mono', monospace">MISSION CONSOLE · REV 0.2</text>

    <!-- center: mission identifier -->
    <g transform="translate(720,48)" text-anchor="middle">
      <text fill="#FFF" font-size="12" letter-spacing="8" opacity="0.6">MISSION</text>
      <text y="26" fill="#FFF" font-size="22" letter-spacing="6" font-weight="500">MARS · SECTOR 14.5°S</text>
    </g>

    <!-- right: live indicator + time -->
    <g transform="translate(1400,46)" text-anchor="end">
      <circle cx="-200" cy="-4" r="5" fill="#FF3B3B"/>
      <text x="-188" y="0" fill="#FF3B3B" font-size="13" letter-spacing="4" font-weight="500" font-family="'Space Mono', monospace">LIVE</text>
      <text y="0" fill="#FFF" font-size="13" letter-spacing="3" font-family="'Space Mono', monospace">2026-04-17 · 14:32:07 UTC</text>
      <text y="22" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5" font-family="'Space Mono', monospace">DEEP SPACE NET · 8.4 GHz · 142 MB/S</text>
    </g>

    <line x1="40" y1="92" x2="1400" y2="92" stroke="#FFF" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- ============ CENTER VIEWPORT ============ -->
  <g transform="translate(40,112)">
    <!-- viewport frame -->
    <rect width="1360" height="560" fill="#030304"/>

    <!-- horizon grid lines -->
    <g stroke="#FFF" stroke-width="0.3" opacity="0.06">
      <line x1="0" y1="140" x2="1360" y2="140"/>
      <line x1="0" y1="280" x2="1360" y2="280"/>
      <line x1="0" y1="420" x2="1360" y2="420"/>
      <line x1="340" y1="0" x2="340" y2="560"/>
      <line x1="680" y1="0" x2="680" y2="560"/>
      <line x1="1020" y1="0" x2="1020" y2="560"/>
    </g>

    <!-- center crosshair (HUD style) -->
    <g stroke="#FFF" stroke-width="0.8" opacity="0.4">
      <line x1="680" y1="270" x2="680" y2="290"/>
      <line x1="670" y1="280" x2="690" y2="280"/>
      <circle cx="680" cy="280" r="18" fill="none" stroke-dasharray="2 3"/>
    </g>

    <!-- planet -->
    <g transform="translate(680,280)">
      <circle r="340" fill="url(#atmo-d)"/>
      <circle r="230" fill="url(#planet-d)"/>
      <!-- surface bands -->
      <ellipse cx="-70" cy="-50" rx="70" ry="14" fill="#3A1608" opacity="0.55"/>
      <ellipse cx="40" cy="70" rx="110" ry="22" fill="#3A1608" opacity="0.45"/>
      <ellipse cx="-130" cy="100" rx="38" ry="10" fill="#6B3820" opacity="0.5"/>
      <circle cx="85" cy="-110" r="28" fill="#2A1008" opacity="0.6"/>
      <!-- polar cap hint -->
      <ellipse cx="0" cy="-215" rx="45" ry="12" fill="#FFF" opacity="0.35"/>
      <ellipse cx="-10" cy="220" rx="35" ry="9" fill="#FFF" opacity="0.25"/>
    </g>

    <!-- HUD: target lock on landing point -->
    <g transform="translate(780,380)">
      <rect x="-40" y="-24" width="80" height="48" fill="none" stroke="#4A9EFF" stroke-width="1"/>
      <use href="#bracket-tl" x="-40" y="-24" transform="translate(0,0)"/>
      <circle cx="0" cy="0" r="4" fill="#4A9EFF"/>
      <line x1="40" y1="0" x2="120" y2="0" stroke="#4A9EFF" stroke-width="0.8"/>
      <line x1="120" y1="0" x2="130" y2="-10" stroke="#4A9EFF" stroke-width="0.8"/>
      <text x="138" y="-14" fill="#4A9EFF" font-size="10" letter-spacing="3" font-family="'Space Mono', monospace">TARGET · VALLES MARINERIS</text>
      <text x="138" y="-2" fill="#FFF" font-size="10" letter-spacing="2" font-family="'Space Mono', monospace" opacity="0.7">−14.502° +175.830°</text>
      <text x="138" y="10" fill="#FFF" font-size="10" letter-spacing="2" font-family="'Space Mono', monospace" opacity="0.5">DIST 47.3 km · BEARING 042.7°</text>
    </g>

    <!-- viewport corner brackets -->
    <use href="#bracket-tl" x="16" y="16"/>
    <use href="#bracket-tr" x="1344" y="16"/>
    <use href="#bracket-bl" x="16" y="544"/>
    <use href="#bracket-br" x="1344" y="544"/>

    <!-- top-left viewport label -->
    <g transform="translate(32,48)" font-family="'Space Mono', monospace">
      <text fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5">CAM · 03 · SURFACE APPROACH</text>
      <text y="14" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.35">EXPOSURE 1/60 · F 2.8 · ISO 800</text>
    </g>

    <!-- top-right signal -->
    <g transform="translate(1328,48)" text-anchor="end" font-family="'Space Mono', monospace">
      <text fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5">SIGNAL</text>
      <g transform="translate(-2,6)">
        <rect x="-6" y="0" width="4" height="10" fill="#FFF"/>
        <rect x="-14" y="-3" width="4" height="13" fill="#FFF"/>
        <rect x="-22" y="-6" width="4" height="16" fill="#FFF"/>
        <rect x="-30" y="-9" width="4" height="19" fill="#FFF" opacity="0.3"/>
      </g>
      <text y="28" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.35">RSSI −64 dBm · LAT 122 ms</text>
    </g>

    <!-- left side: phase timeline -->
    <g transform="translate(32,180)" font-family="'Space Mono', monospace">
      <text fill="#FFF" font-size="10" letter-spacing="5" opacity="0.5">FLIGHT PHASE</text>
      <line x1="0" y1="14" x2="180" y2="14" stroke="#FFF" stroke-width="0.5" opacity="0.25"/>
      <!-- checklist -->
      <g fill="#FFF" font-size="11" letter-spacing="2">
        <text x="0" y="40" opacity="0.3">✓ ORBIT INSERTION</text>
        <text x="0" y="62" opacity="0.3">✓ DE-ORBIT BURN</text>
        <text x="0" y="84" opacity="0.3">✓ ATMOSPHERIC ENTRY</text>
        <text x="0" y="106" opacity="0.3">✓ CHUTE DEPLOY</text>
        <text x="0" y="128" opacity="0.3">✓ TOUCHDOWN</text>
        <!-- current phase -->
        <rect x="-8" y="140" width="200" height="20" fill="#FFF" opacity="0.1"/>
        <circle cx="0" cy="150" r="4" fill="#00D68F"/>
        <text x="12" y="154" fill="#00D68F">▸ SURFACE WALK</text>
        <text x="0" y="180" opacity="0.15">· EXTENDED SURVEY</text>
        <text x="0" y="202" opacity="0.15">· RETURN VEHICLE PREP</text>
      </g>
    </g>

    <!-- right side: trajectory / orbit mini-map -->
    <g transform="translate(1188,180)" font-family="'Space Mono', monospace">
      <text fill="#FFF" font-size="10" letter-spacing="5" opacity="0.5">TRAJECTORY</text>
      <line x1="0" y1="14" x2="140" y2="14" stroke="#FFF" stroke-width="0.5" opacity="0.25"/>

      <g transform="translate(70,100)">
        <!-- planet silhouette -->
        <circle r="44" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.4"/>
        <circle r="44" fill="#3A1608" opacity="0.35"/>
        <!-- orbit path -->
        <ellipse rx="64" ry="60" fill="none" stroke="#FFF" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>
        <!-- approach trajectory -->
        <path d="M -80 -48 Q -30 -20 0 32 Q 18 52 32 50" fill="none" stroke="#4A9EFF" stroke-width="1"/>
        <!-- current position -->
        <circle cx="32" cy="50" r="3.5" fill="#00D68F"/>
        <circle cx="32" cy="50" r="8" fill="none" stroke="#00D68F" stroke-width="0.5" opacity="0.6"/>
        <!-- start marker -->
        <circle cx="-80" cy="-48" r="2" fill="#FFF"/>
      </g>
      <text x="70" y="170" fill="#FFF" font-size="9" letter-spacing="3" text-anchor="middle" opacity="0.5">ENTRY · Δ 47.3 km</text>
    </g>

    <!-- right side bottom: attitude indicator -->
    <g transform="translate(1188,360)" font-family="'Space Mono', monospace">
      <text fill="#FFF" font-size="10" letter-spacing="5" opacity="0.5">ATTITUDE</text>
      <line x1="0" y1="14" x2="140" y2="14" stroke="#FFF" stroke-width="0.5" opacity="0.25"/>

      <g transform="translate(70,90)">
        <circle r="60" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.3"/>
        <circle r="60" fill="#9E5130" opacity="0.15"/>
        <!-- horizon line -->
        <rect x="-60" y="-8" width="120" height="60" fill="#9E5130" opacity="0.3"/>
        <line x1="-60" y1="-8" x2="60" y2="-8" stroke="#FFF" stroke-width="0.5" opacity="0.5"/>
        <!-- aircraft marker -->
        <line x1="-24" y1="0" x2="-10" y2="0" stroke="#FFDE00" stroke-width="2"/>
        <line x1="10" y1="0" x2="24" y2="0" stroke="#FFDE00" stroke-width="2"/>
        <circle r="2" fill="#FFDE00"/>
        <!-- ticks -->
        <text x="0" y="-68" font-size="8" text-anchor="middle" fill="#FFF" opacity="0.5">0°</text>
        <text x="68" y="4" font-size="8" text-anchor="middle" fill="#FFF" opacity="0.5">R</text>
        <text x="-68" y="4" font-size="8" text-anchor="middle" fill="#FFF" opacity="0.5">L</text>
      </g>
      <text x="70" y="176" fill="#FFF" font-size="9" letter-spacing="3" text-anchor="middle" opacity="0.5">PITCH +2.4° · ROLL −0.8°</text>
    </g>
  </g>

  <!-- ============ BOTTOM TELEMETRY STRIP (SpaceX webcast signature) ============ -->
  <g transform="translate(40,700)">
    <rect width="1360" height="130" fill="#0A0A0C" stroke="#FFF" stroke-width="0.3" opacity="0.98"/>
    <line x1="0" y1="0" x2="1360" y2="0" stroke="#FFF" stroke-width="0.5" opacity="0.4"/>

    <!-- 5 columns divided by vertical lines -->
    <g stroke="#FFF" stroke-width="0.3" opacity="0.2">
      <line x1="272" y1="16" x2="272" y2="114"/>
      <line x1="544" y1="16" x2="544" y2="114"/>
      <line x1="816" y1="16" x2="816" y2="114"/>
      <line x1="1088" y1="16" x2="1088" y2="114"/>
    </g>

    <!-- SPEED -->
    <g transform="translate(24,0)" font-family="'Space Mono', monospace">
      <text x="0" y="32" fill="#FFF" font-size="10" letter-spacing="6" opacity="0.5">SPEED</text>
      <text x="0" y="82" fill="#FFF" font-size="54" font-weight="300" font-family="'Inter', sans-serif" letter-spacing="-1">4.2</text>
      <text x="0" y="108" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5">M · S⁻¹</text>
      <!-- tiny sparkline -->
      <polyline points="200,90 210,85 220,80 230,88 240,75 250,72" fill="none" stroke="#00D68F" stroke-width="1.2"/>
    </g>

    <!-- ALTITUDE -->
    <g transform="translate(296,0)" font-family="'Space Mono', monospace">
      <text x="0" y="32" fill="#FFF" font-size="10" letter-spacing="6" opacity="0.5">ALTITUDE</text>
      <text x="0" y="82" fill="#FFF" font-size="54" font-weight="300" font-family="'Inter', sans-serif" letter-spacing="-1">2,847</text>
      <text x="0" y="108" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5">METERS · DATUM MOLA</text>
    </g>

    <!-- LAT / LON -->
    <g transform="translate(568,0)" font-family="'Space Mono', monospace">
      <text x="0" y="32" fill="#FFF" font-size="10" letter-spacing="6" opacity="0.5">COORDINATES</text>
      <text x="0" y="66" fill="#FFF" font-size="22" font-weight="300" font-family="'Inter', sans-serif" letter-spacing="1">−14.502°<tspan fill="#FFF" opacity="0.4" font-size="12"> LAT</tspan></text>
      <text x="0" y="94" fill="#FFF" font-size="22" font-weight="300" font-family="'Inter', sans-serif" letter-spacing="1">+175.830°<tspan fill="#FFF" opacity="0.4" font-size="12"> LON</tspan></text>
      <text x="0" y="114" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5">WGS · MARS2000</text>
    </g>

    <!-- SOL / TIME (SpaceX T+ style) -->
    <g transform="translate(840,0)" font-family="'Space Mono', monospace">
      <text x="0" y="32" fill="#FFF" font-size="10" letter-spacing="6" opacity="0.5">MISSION TIME</text>
      <text x="0" y="82" fill="#FFF" font-size="54" font-weight="300" font-family="'Inter', sans-serif" letter-spacing="-1">T+<tspan>47</tspan></text>
      <text x="0" y="108" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.5">SOL · 12:41 LMST</text>
    </g>

    <!-- GRAVITY / FPS -->
    <g transform="translate(1112,0)" font-family="'Space Mono', monospace">
      <text x="0" y="32" fill="#FFF" font-size="10" letter-spacing="6" opacity="0.5">SYSTEM</text>
      <g font-size="13" font-family="'Space Mono', monospace" fill="#FFF">
        <text x="0" y="56">GRAVITY</text>
        <text x="220" y="56" text-anchor="end">3.72 m·s⁻²</text>
        <text x="0" y="76">FPS</text>
        <text x="220" y="76" text-anchor="end" fill="#00D68F">60.0</text>
        <text x="0" y="96">LOD NODES</text>
        <text x="220" y="96" text-anchor="end">1,284</text>
        <text x="0" y="116" opacity="0.5">MEM</text>
        <text x="220" y="116" text-anchor="end" opacity="0.5">142 MB</text>
      </g>
    </g>
  </g>

  <!-- ============ VERY BOTTOM KEY STRIP ============ -->
  <g transform="translate(40,850)" font-family="'Space Mono', monospace">
    <text fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55">[ W A S D ] TRANSLATE</text>
    <text x="220" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55">[ ␣ ] JUMP</text>
    <text x="320" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55">[ MOUSE ] GAZE</text>
    <text x="460" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55">[ TAB ] ORBIT / SURFACE</text>
    <text x="660" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55">[ M ] CHART</text>
    <text x="760" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55">[ F ] LOG</text>
    <text x="1360" fill="#FFF" font-size="10" letter-spacing="4" opacity="0.55" text-anchor="end">PLANET·WALK / S045PD / 2026</text>
  </g>
</svg>
